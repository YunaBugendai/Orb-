name: Orb! Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Read Orb! version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "src/common.h" -Pattern '^#define ORB_VERSION "([^"]+)"'
          if (-not $match) { throw "ORB_VERSION was not found in src/common.h." }
          "version=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - name: Set up UCRT64 build tools
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
      - name: Validate MinGW installer helper
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/windows/setup-mingw.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            throw "The MinGW setup helper contains PowerShell syntax errors."
          }
          $bin = Join-Path $env:MSYS2_ROOT "ucrt64\bin"
          Write-Host "MSYS2 root: $env:MSYS2_ROOT"
          Write-Host "UCRT64 bin exists: $(Test-Path $bin)"
          $gcc = Join-Path $bin "gcc.exe"
          $as = Join-Path $bin "as.exe"
          Write-Host "gcc.exe exists: $(Test-Path $gcc); as.exe exists: $(Test-Path $as)"
          if (Test-Path $gcc) {
            & $gcc -dumpmachine
            Write-Host "gcc exit: $LASTEXITCODE"
          }
          if (Test-Path $as) {
            & $as --version | Select-Object -First 1
            Write-Host "as exit: $LASTEXITCODE"
          }
          & "tools/windows/setup-mingw.ps1" -DetectOnly
      - name: Build and smoke-test native Orb! compiler
        shell: msys2 {0}
        run: |
          make CFLAGS="-O2 -std=gnu11 -Wall -Wextra -Wno-unused-parameter -Wno-clobbered -static -static-libgcc"
          ./build/orb.exe version
          ./build/orb.exe doctor
          ./build/orb.exe build examples/hello.orb -o build/orb-windows-smoke.exe
          ./build/orb-windows-smoke.exe
      - name: Set up Python for VS Code packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke-test the package-manager CLI
        shell: pwsh
        run: |
          $env:ORB_PYTHON = (Get-Command python).Source
          & ".\build\orb.exe" pkg --help
      - name: Package the VS Code extension
        shell: pwsh
        run: python tools/package-vsix.py build/dist
      - name: Compile the graphical installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 6 compiler was not found on this runner."
          }
          & $iscc "installer\Orb.iss"
      - name: Upload Orb! Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Orb-Setup-${{ steps.version.outputs.version }}
          path: build/installer/Orb-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 90
